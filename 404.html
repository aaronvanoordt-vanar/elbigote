<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada · El Bigote Coffee &amp; Waffles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Outfit:wght@300..700&display=swap">
<style>
  /* Autónomo a propósito: el 404 se sirve desde cualquier ruta y las
     rutas relativas a CSS no serían fiables. */
  *,*::before,*::after{box-sizing:border-box;margin:0}
  body{min-height:100svh;display:grid;place-items:center;text-align:center;padding:2rem;
    background:radial-gradient(80% 60% at 50% 0%,rgba(0,79,156,.35),transparent 60%),#001B3A;
    color:#F4F8FD;font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  img.marca{width:min(190px,52vw);margin-inline:auto;display:block}
  h1{font-family:'Bricolage Grotesque',Helvetica,Arial,sans-serif;font-weight:800;
    font-size:clamp(2rem,1.3rem+3.4vw,3.4rem);line-height:1.05;margin:1.5rem 0 .8rem;letter-spacing:-.02em}
  h1 em{font-style:normal;color:#E2A33F}
  p{color:rgba(244,248,253,.7);max-width:44ch;margin-inline:auto;line-height:1.65}
  .cta{margin-top:2rem;display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
  a{display:inline-flex;align-items:center;padding:.85rem 1.6rem;border-radius:999px;
    text-decoration:none;font-weight:600;font-size:.95rem;border:1.5px solid;transition:transform .2s,background-color .2s,color .2s}
  a:hover{transform:translateY(-2px)}
  .gold{background:#E2A33F;color:#2A1B03;border-color:#E2A33F}
  .gold:hover{background:#F6DFB4;border-color:#F6DFB4}
  .ghost{background:transparent;color:#F4F8FD;border-color:rgba(246,236,224,.3)}
  .ghost:hover{color:#E2A33F;border-color:#E2A33F}
  a:focus-visible{outline:3px solid #F6DFB4;outline-offset:3px}
</style>
</head>
<body>
  <main>
    <img class="marca" src="/assets/brand/logo-elbigote-claro.png" id="marca" alt="El Bigote Coffee &amp; Waffles">
    <h1>Esta página se nos <em>quemó</em></h1>
    <p>No encontramos lo que buscabas. Vuelve al inicio o escríbenos y te ayudamos.</p>
    <div class="cta">
      <a class="gold" id="inicio" href="/">Volver al inicio</a>
      <a class="ghost" href="https://wa.me/51936819234" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
    </div>
  </main>
<script>
  // En una "project page" (usuario.github.io/repo/) la raíz no es "/", sino "/repo/".
  (function () {
    if (!/\.github\.io$/.test(location.hostname)) return;
    var base = location.pathname.split('/')[1];
    if (!base) return;
    document.getElementById('inicio').setAttribute('href', '/' + base + '/');
    var m = document.getElementById('marca');
    if (m) m.setAttribute('src', '/' + base + '/assets/brand/logo-elbigote-claro.png');
  })();
</script>
</body>
</html>
